<!DOCTYPE html>
<html>
<head>
  <title>Gemini Chatbot GUI</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
        display: none;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* Context 섹션 스타일링 */
    button:hover {
      opacity: 0.8;
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    </style>
  
</head>
<body>
  <ul id="messages"></ul>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="프롬프트 입력" />
    <input type="file" id="image" accept="image/*" />  <!-- 이미지 선택 -->
    <button>Send</button>
  </form>
  <script>
  const socket = io();
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const imageInput = document.getElementById('image');
  const messages = document.getElementById('messages');

  // Space 선택 UI (동적 select)
  const spaceSelect = document.createElement('select');
  spaceSelect.id = 'spaceSelect';
  document.body.insertBefore(spaceSelect, form);  // 폼 위에 추가

  // Space 목록 업데이트 함수
  function updateSpaceSelect(spaces) {
    spaceSelect.innerHTML = spaces.map(s => `<option value="${s}">${s}</option>`).join('');
    if (!spaces.includes(spaceSelect.value)) spaceSelect.value = spaces[0] || 'default';
  }

  // 초기 목록 요청 및 이벤트
  socket.on('connect', () => socket.emit('list spaces'));
  socket.on('space list', updateSpaceSelect);

  // Add Space 버튼 (prompt로 입력)
  const addBtn = document.createElement('button');
  addBtn.textContent = 'Add Space';
  addBtn.onclick = () => {
    const newSpace = prompt('New Space name?');
    if (newSpace) socket.emit('add space', newSpace);
  };
  document.body.insertBefore(addBtn, form);

  // Delete Space 버튼
  const delBtn = document.createElement('button');
  delBtn.textContent = 'Delete Current Space';
  delBtn.onclick = () => {
    if (confirm(`Delete ${spaceSelect.value}?`)) socket.emit('delete space', spaceSelect.value);
  };
  document.body.insertBefore(delBtn, form);

  // Context 파일 업로드 Form (Space에 영향을 주는 파일)
  const contextForm = document.createElement('form');
  contextForm.style.border = '1px solid #ccc';
  contextForm.style.padding = '10px';
  contextForm.style.margin = '10px 0';

  const contextLabel = document.createElement('label');
  contextLabel.textContent = 'Context 파일 업로드 (Space에 추가): ';
  contextForm.appendChild(contextLabel);

  const contextInput = document.createElement('input');
  contextInput.type = 'file';
  contextInput.multiple = true;
  contextInput.accept = '.pdf,.csv,.xlsx,.docx,.hwpx,.txt,.md';
  contextInput.style.margin = '5px';
  contextForm.appendChild(contextInput);

  const extractBtn = document.createElement('button');
  extractBtn.type = 'button';
  extractBtn.textContent = 'Upload & Extract to Space';
  extractBtn.style.margin = '5px';
  extractBtn.style.backgroundColor = '#4CAF50';
  extractBtn.style.color = 'white';
  extractBtn.style.border = 'none';
  extractBtn.style.padding = '8px 16px';
  extractBtn.style.cursor = 'pointer';
  contextForm.appendChild(extractBtn);

  document.body.insertBefore(contextForm, form);


  // Space 전환 이벤트 (히스토리 로드 및 UI 업데이트 추가)
  spaceSelect.addEventListener('change', () => socket.emit('switch space', spaceSelect.value));
  socket.on('space switched', (data) => {
    console.log('Switched to', data.name);
    messages.innerHTML = '';  // 이전 대화 클리어
    
    // [핵심 수정] 히스토리 배열 구조 확인 및 렌더링
    if (!data.history || !Array.isArray(data.history)) {
      console.warn('[DEBUG] No history data received');
      messages.innerHTML = '<li>No history available for this space.</li>';
      return;
    }
    
    // 배열 순회하며 UI 생성
    data.history.forEach((msg, index) => {
      if (!msg || !msg.role || !msg.content) {
        console.warn('[DEBUG] Invalid history item at index', index);
        return;
      }
      const item = document.createElement('li');
      const role = msg.role === 'user' ? 'You: ' : 'Gemini: ';
      try {
        item.innerHTML = marked.parse(role + msg.content);
      } catch (parseError) {
        console.error('[DEBUG] Parse error:', parseError);
        item.textContent = role + msg.content;  // 파싱 실패 시 텍스트만 표시
      }
      messages.appendChild(item);
    });
    
    // [개선] 렌더링 후 스크롤 및 지연 보장
    setTimeout(() => {
      scrollToBottom();
    }, 100);  // 이벤트 루프 지연으로 UI 업데이트 보장
  });

  // Context 파일 업로드 및 Extract 버튼 이벤트
  extractBtn.onclick = (e) => {
    e.preventDefault();
    if (contextInput.files.length > 0) {
        extractBtn.textContent = `Uploading ${contextInput.files.length} file(s)...`;
        extractBtn.disabled = true;

        const formData = new FormData();
        // 모든 선택된 파일을 formData에 추가
        for (const file of contextInput.files) {
            formData.append('files', file); // 서버의 .array('files')와 이름 일치
        }
        formData.append('space', spaceSelect.value);
        
        fetch('/upload-context', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert(`${data.fileNames.length}개 파일 업로드 및 추출 완료!`);
                    socket.emit('list files', spaceSelect.value); // 파일 목록 새로고침
                } else {
                    alert(`업로드 실패: ${data.error}`);
                }
            })
            .finally(() => {
                extractBtn.textContent = 'Upload File(s) to Space';
                extractBtn.disabled = false;
                contextInput.value = ''; // 입력 필드 초기화
            });
    } else {
        alert('파일을 선택해주세요.');
    }
  };


  // 파일 목록 새로고침 버튼
  const refreshBtn = document.createElement('button');
  refreshBtn.textContent = 'Refresh File List';
  refreshBtn.onclick = () => socket.emit('list files', spaceSelect.value);
  refreshBtn.style.margin = '5px';
  document.body.appendChild(refreshBtn);

  // 파일 목록 제목
  const fileListTitle = document.createElement('h4');
  fileListTitle.textContent = 'Context Files in Current Space:';
  document.body.appendChild(fileListTitle);

  // 파일 목록 UI (기존)
  const fileList = document.createElement('ul');
  document.body.appendChild(fileList);
  socket.on('file list', files => {
    fileList.innerHTML = files.map(f => `<li>${f} <button onclick="socket.emit('delete file', {spaceName: spaceSelect.value, fileName: '${f}'});">Delete</button></li>`).join('');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (input.value || imageInput.files.length) {
      let imagePath = null;

      // 이미지 업로드 (있을 경우)
      if (imageInput.files.length) {
        const formData = new FormData();
        formData.append('image', imageInput.files[0]);

        const res = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();
        imagePath = data.imagePath;
      }

      // 사용자 메시지 표시
      const userItem = document.createElement('li');
      userItem.textContent = 'You: ' + (input.value || '이미지 분석 요청');
      messages.appendChild(userItem);
      scrollToBottom(); // 여기에 추가

      // 서버로 전송
      socket.emit('chat message', { prompt: input.value, imagePath });
      input.value = '';
      imageInput.value = '';  // 입력 초기화
    }
  });


  // 응답 중 표시
  socket.on('thinking', (msg) => {
    const thinkingItem = document.createElement('li');
    thinkingItem.textContent = msg;
    thinkingItem.id = 'thinking';  // 나중에 제거/대체 위해 ID 추가
    messages.appendChild(thinkingItem);
  });

  // 실제 응답 표시 (thinking 메시지 제거 후 추가)
  socket.on('chat message', (msg) => {
    const thinking = document.getElementById('thinking');
    if (thinking) thinking.remove();  
    
    const item = document.createElement('li');
    item.innerHTML = marked.parse('Gemini: ' + msg);
    messages.appendChild(item);
    scrollToBottom(); // 여기에 추가
  });


  // 스크립트 부분에 추가
  const spinner = document.createElement('div');
  spinner.className = 'spinner';
  spinner.id = 'loading-spinner';
  spinner.setAttribute('role', 'status');
  spinner.setAttribute('aria-live', 'polite');
  messages.appendChild(spinner);

  socket.on('thinking', () => {
  document.getElementById('loading-spinner').style.display = 'block';
  });

  socket.on('chat done', () => {
  document.getElementById('loading-spinner').style.display = 'none';
  });

  function scrollToBottom() {
    messages.scrollTop = messages.scrollHeight;
  }
</script>


</body>
</html>
