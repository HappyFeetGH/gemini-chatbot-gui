<!DOCTYPE html>
<html>
<head>
  <title>Gemini Chatbot GUI</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        animation: spin 1s linear infinite;
        display: none;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    </style>
  
</head>
<body>
  <ul id="messages"></ul>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="프롬프트 입력" />
    <input type="file" id="image" accept="image/*" />  <!-- 이미지 선택 -->
    <button>Send</button>
  </form>
  <script>
    const socket = io();
    const messages = document.getElementById('messages');

    // Space 선택 UI (기존)
    const spaceSelect = document.createElement('select');
    spaceSelect.id = 'spaceSelect';
    document.body.appendChild(spaceSelect);

    // Space 목록 업데이트 함수 (기존)
    function updateSpaceSelect(spaces) {
      spaceSelect.innerHTML = spaces.map(s => `<option value="${s}">${s}</option>`).join('');
      if (!spaces.includes(spaceSelect.value)) spaceSelect.value = spaces[0] || 'default';
    }

    // 초기 목록 요청 및 이벤트 (기존)
    socket.on('connect', () => socket.emit('list spaces'));
    socket.on('space list', updateSpaceSelect);

    // Add/Delete Space 버튼 (기존)
    const addBtn = document.createElement('button');
    addBtn.textContent = 'Add Space';
    addBtn.onclick = () => {
      const newSpace = prompt('New Space name?');
      if (newSpace) socket.emit('add space', newSpace);
    };
    document.body.appendChild(addBtn);

    const delBtn = document.createElement('button');
    delBtn.textContent = 'Delete Current Space';
    delBtn.onclick = () => {
      if (confirm(`Delete ${spaceSelect.value}?`)) socket.emit('delete space', spaceSelect.value);
    };
    document.body.appendChild(delBtn);

    // Space 전환 이벤트 (기존)
    spaceSelect.addEventListener('change', () => socket.emit('switch space', spaceSelect.value));
    socket.on('space switched', (data) => console.log('Switched to', data.name));

    // 1. Space에 영향을 주는 파일 업로드 Form (새로 분리: Context 파일)
    const contextForm = document.createElement('form');
    const contextInput = document.createElement('input');
    contextInput.type = 'file';
    contextInput.accept = '.pdf,.csv,.xlsx,.docx,.hwpx,.txt,.md';  // 지원 확장자 제한
    const extractBtn = document.createElement('button');
    extractBtn.textContent = 'Upload & Extract to Space';
    contextForm.appendChild(contextInput);
    contextForm.appendChild(extractBtn);
    document.body.appendChild(contextForm);

    extractBtn.onclick = (e) => {
      e.preventDefault();
      if (contextInput.files.length) {
        const formData = new FormData();
        formData.append('file', contextInput.files[0]);
        formData.append('space', spaceSelect.value);
        fetch('/upload-context', { method: 'POST', body: formData }).then(() => {
          socket.emit('extract context', spaceSelect.value);  // 서버에 추출 요청
          console.log('Extraction triggered for space:', spaceSelect.value);
        });
      }
    };

    // 2. 쿼리에 영향을 주는 파일 Form (기존: 이미지 등 즉시 쿼리용)
    const queryForm = document.getElementById('form');  // 기존 form 사용
    const queryInput = document.getElementById('input');
    const queryImageInput = document.getElementById('image');
    const querySubmitBtn = queryForm.querySelector('button');

    queryForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (queryInput.value || queryImageInput.files.length) {
        let imagePath = null;
        if (queryImageInput.files.length) {
          const formData = new FormData();
          formData.append('image', queryImageInput.files[0]);
          const res = await fetch('/upload', { method: 'POST', body: formData });
          const data = await res.json();
          imagePath = data.imagePath;
        }
        const userItem = document.createElement('li');
        userItem.textContent = 'You: ' + (queryInput.value || '이미지 분석 요청');
        messages.appendChild(userItem);
        socket.emit('chat message', { prompt: queryInput.value, imagePath });
        queryInput.value = '';
        queryImageInput.value = '';
      }
    });

    // 파일 목록 UI (기존)
    const fileList = document.createElement('ul');
    document.body.appendChild(fileList);
    socket.on('file list', files => {
      fileList.innerHTML = files.map(f => `<li>${f} <button onclick="socket.emit('delete file', {spaceName: spaceSelect.value, fileName: '${f}'});">Delete</button></li>`).join('');
    });

    // 응답 처리 (기존, Markdown 포함)
    socket.on('thinking', () => document.getElementById('loading-spinner').style.display = 'block');
    socket.on('chat done', () => document.getElementById('loading-spinner').style.display = 'none');

    socket.on('chat message', (msg) => {
      const thinking = document.getElementById('thinking');
      if (thinking) thinking.remove();
      const item = document.createElement('li');
      item.innerHTML = marked.parse('Gemini: ' + msg);
      messages.appendChild(item);
      scrollToBottom();
    });

    // 스크롤 함수 (기존)
    function scrollToBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    // 스피너 (기존)
    const spinner = document.createElement('div');
    spinner.className = 'spinner';
    spinner.id = 'loading-spinner';
    spinner.style.display = 'none';
    messages.appendChild(spinner);
  </script>

</body>
</html>
